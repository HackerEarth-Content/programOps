# Two independent containers: no shared dependency, no depends_on, no inter-container
# hostnames. Each can also be built/run/deployed on its own (docker build / docker run).
# They only meet through public URLs: the frontend is built with the backend's URL (frontend/.env), and
# the backend's FRONTEND_URL / API_BASE_URL env vars (CORS, OAuth redirects) point back.
services:
  backend:
    build: ./backend
    env_file: backend/.env  # DATABASE_URL must be reachable from the container (not localhost)
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend  # backend URL comes from frontend/.env (VITE_API_BASE_URL), baked in at build
    ports:
      - "80:80"
